name: Build Windows Exe

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Exe
        run: |
          npm install electron electron-packager --save-dev
          npx electron-packager . CyberVerse3D --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Upload Exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberVerse3D-Windows
          path: dist/CyberVerse3D-win32-x64/
